# ── Aplicación ─────────────────────────────────────────
spring.application.name=listaespera
server.port=8080

# ── PostgreSQL ──────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lista_espera_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:brisas123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ─────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:rednorte-super-secret-key-2025-minimo32chars!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── URLs de servicios downstream ────────────────────────
services.paciente.url=${PACIENTE_SERVICE_URL:http://localhost:8081}
services.medico.url=${MEDICO_SERVICE_URL:http://localhost:8082}

# ── Resilience4j Circuit Breaker ────────────────────────
resilience4j.circuitbreaker.instances.listaEsperaService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.listaEsperaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.listaEsperaService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.medicoClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.medicoClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.medicoClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.pacienteClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.pacienteClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pacienteClient.waitDurationInOpenState=10s

# ── Logging ─────────────────────────────────────────────
logging.level.cl.duoc.rednorte=DEBUG
logging.level.org.springframework.security=WARN